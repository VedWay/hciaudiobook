server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 45m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_buffering off;          # answers are streamed sentence by sentence
    proxy_read_timeout 120s;
  }
  location / {
    try_files $uri /index.html;   # single-page app routes
  }
}
